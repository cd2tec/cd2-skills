name: Publicar release do plugin

# Roda quando a versão em core/*/plugin.core.json muda (ou manualmente).
# Cria a release cd2-varejo-v<versão> com os ZIPs de cada plataforma. Se a
# release já existe, só envia os arquivos que faltarem.

on:
  push:
    branches: [main]
    paths:
      - "core/*/plugin.core.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conferir sincronia antes de empacotar
        run: python3 scripts/sync_plugins.py --check

      - name: Empacotar
        id: pkg
        run: python3 scripts/package_plugins.py --out dist

      - name: Criar a release ou completar os arquivos que faltam
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.pkg.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            plugin="${tag%-v*}"
            version="${tag##*-v}"
            if gh release view "$tag" >/dev/null 2>&1; then
              # Release existente: não recria nem sobrescreve, só completa o que falta.
              existing=$(gh release view "$tag" --json assets --jq '.assets[].name')
              for f in dist/"$plugin"-*.zip; do
                name=$(basename "$f")
                if grep -qxF "$name" <<<"$existing"; then
                  echo "$tag já tem $name."
                else
                  echo "$tag: enviando $name, que faltava."
                  gh release upload "$tag" "$f"
                fi
              done
              continue
            fi
            cat > release-notes.md <<EOF
          Plugin \`$plugin\` versão $version, da CD2 Tech.

          | Arquivo | Para qual plataforma |
          |---|---|
          | \`$plugin-claude-$version.zip\` | Claude Cowork. Pessoal: Customize, Plugins. Organização: Organization settings, Plugins & skills, Add, Upload a plugin. |
          | \`$plugin-codex-$version.zip\` | Codex e ChatGPT Work, quando você não for usar o import pelo GitHub. |
          | \`$plugin-dsh-$version.zip\` | DeepSeek Harness. Descompacte e rode \`python3 install.py\`, que copia as skills para \`~/.agents/skills\`. |
          | \`$plugin-gpts-$version.zip\` | GPTs para a GPT Store. Cada GPT tem instruções, arquivos de conhecimento e um guia de publicação manual. |
          | \`$plugin-claude.zip\`, \`$plugin-codex.zip\`, \`$plugin-dsh.zip\` e \`$plugin-gpts.zip\` | Os mesmos arquivos, sem a versão no nome, para o link fixo \`releases/latest/download/...\`. |

          No Claude Code, no Codex e no ChatGPT Work (import de marketplace) você não precisa baixar nada. Instale direto do repositório, como descrito no README.
          EOF
            # Prepende a seção "## <versão>" do CHANGELOG.md, quando existir.
            changes=$(awk -v v="$version" '$0=="## "v{f=1;next} /^## /{f=0} f' CHANGELOG.md 2>/dev/null || true)
            if [ -n "${changes//[[:space:]]/}" ]; then
              { printf '%s\n\n---\n\n' "$changes"; cat release-notes.md; } > release-body.md
            else
              mv release-notes.md release-body.md
            fi
            gh release create "$tag" dist/"$plugin"-*.zip \
              --title "$plugin $version" \
              --notes-file release-body.md \
              --target "$GITHUB_SHA"
          done
