name: Conferir sincronia e testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: core/ e plugins/ estão iguais
        run: python3 scripts/sync_plugins.py --check
      - name: Testes
        # Inclui o teste de TTY do render.py, que usa o módulo pty da biblioteca padrão e roda no Linux.
        run: python3 -m unittest discover -s tests -v
      - name: JSON dos manifestos, marketplaces e GPTs é válido
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for f in harnesses.json skills.json .claude-plugin/marketplace.json .agents/plugins/marketplace.json plugins/*/*/plugin.json plugins/*/*/.claude-plugin/plugin.json core/*/plugin.core.json gpts/*/gpt.json; do
            [ -f "$f" ] || { echo "faltando: $f"; exit 1; }
            python3 -m json.tool "$f" > /dev/null
            echo "ok $f"
            count=$((count + 1))
          done
          echo "$count arquivos JSON válidos."
